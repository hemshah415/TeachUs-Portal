services:
  # 1. Express Backend API & Python Validator Engine (Docker Container)
  - type: web
    name: teachus-backend-api
    runtime: docker
    dockerfilePath: Dockerfile.backend
    plan: free
    envVars:
      - key: PORT
        value: "5000"
      - key: JWT_SECRET
        value: "teachus_super_secret_jwt_key_2026"
      - key: DB_HOST
        value: "localhost"
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: "root"
      - key: DB_PASSWORD
        value: "YourPassword123"
      - key: DB_NAME
        value: "college_data_management"

  # 2. React Vite Frontend Web Portal (Static Site)
  - type: web
    name: teachus-college-portal
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: teachus-backend-api
          property: host
