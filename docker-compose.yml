version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: college_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: YourPassword123
      MYSQL_DATABASE: college_data_management
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Express Backend API & Python Validator Engine
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: college_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: teachus_super_secret_jwt_key_2026
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: YourPassword123
      DB_NAME: college_data_management
    depends_on:
      - mysql

  # React Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
